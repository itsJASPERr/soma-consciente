name: Website - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('website-pr-{0}', github.event.pull_request.number) || format('website-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate learning content
        run: npm run content:check
      - name: Diagnose editorial photo links
        continue-on-error: true
        run: node scripts/check-media-links.mjs
      - name: Verify free/preview/locked static exports
        run: npm run test:access
      - name: Build static site
        run: npm run build
      - name: Verify www domain and root-relative URLs
        run: npm run test:domain
      - name: Verify social link previews
        run: npm run test:og
      - name: Responsive browser verification
        timeout-minutes: 3
        run: npm run test:responsive
      - name: Save mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Upload Cloudflare preview artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-dist
          path: dist/
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  preview:
    name: Cloudflare Pages preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-preview
      url: https://pr-${{ github.event.pull_request.number }}.soma-consciente-preview.pages.dev/
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-preview-dist
          path: dist/
      - name: Deploy preview with Wrangler
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.160.1 pages deploy dist --project-name=soma-consciente-preview \
            --branch="$PREVIEW_BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=false
