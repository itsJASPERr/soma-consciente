name: Production search checks

on:
  workflow_run:
    workflows: [Website - GitHub Pages, Website build and deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify live search readiness
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify search metadata and analytics on the public site
        run: python3 scripts/check-live-search.py
