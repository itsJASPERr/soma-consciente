media:
  input: public/media
  output: /soma-consciente/media
  rename: safe

content:
  - name: home-images
    label: Imágenes de la página de inicio
    type: file
    path: src/content/home/home.json
    format: json
    fields:
      - name: heroImage
        label: Foto principal del inicio
        type: image
        required: true
      - name: heroAlt
        label: Descripción accesible de la foto principal
        type: string
        required: true
      - name: heroPosition
        label: Encuadre de la foto principal (CSS object-position)
        type: string
      - name: nucleoImage
        label: Imagen del Núcleo
        type: image
        required: true
      - name: nucleoAlt
        label: Descripción de la imagen del Núcleo
        type: string
        required: true
      - name: onlineImage
        label: Imagen del acompañamiento online
        type: image
        required: true
      - name: onlineAlt
        label: Descripción de la imagen online
        type: string
        required: true
      - name: encountersImage
        label: Imagen de Encuentros
        type: image
        required: true
      - name: encountersAlt
        label: Descripción de la imagen de Encuentros
        type: string
        required: true

  - name: aulas
    label: Las cuatro Aulas
    type: collection
    path: src/content/aulas
    format: json
    filename: "{fields.slug}.json"
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [name, guide, published, order]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: Identificador URL (no cambiar)
        type: string
        required: true
        readonly: true
      - name: name
        label: Título del Aula
        type: string
        required: true
      - name: shortName
        label: Nombre corto
        type: string
        required: true
      - name: guide
        label: Facilitador/a
        type: string
        required: true
      - name: qualification
        label: Trayectoria
        type: text
      - name: theme
        label: Paleta (terra, azul, oro, verde)
        type: string
        readonly: true
      - name: symbol
        label: Símbolo de marca (heart, sound, horse, body)
        type: string
        readonly: true
      - name: summary
        label: Resumen
        type: text
        required: true
      - name: description
        label: Introducción
        type: text
        required: true
      - name: approach
        label: Enfoque
        type: text
        required: true
      - name: practices
        label: Temáticas
        type: string
        list: true
      - name: invitation
        label: Frase central
        type: text
      - name: coverImage
        label: Foto de portada del Aula
        type: image
      - name: coverAlt
        label: Descripción accesible de la foto
        type: string
      - name: portraitImage
        label: Fotografía auténtica del facilitador/a
        type: image
      - name: portraitAlt
        label: Descripción accesible del retrato
        type: string
      - name: order
        label: Orden de navegación
        type: number
        readonly: true
      - name: published
        label: Publicado
        type: boolean

  - name: recursos
    label: Biblioteca de recursos
    type: collection
    path: src/content/recursos
    format: json
    filename: "{fields.slug}.json"
    operations:
      rename: false
    view:
      fields: [title, category, duration, published]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: URL / slug
        type: string
        required: true
      - name: title
        label: Título
        type: string
        required: true
      - name: category
        label: Tipo de recurso
        type: string
        required: true
      - name: summary
        label: Resumen
        type: text
        required: true
      - name: duration
        label: Duración orientativa
        type: string
      - name: image
        label: Imagen del recurso (Biblioteca)
        type: image
      - name: imageAlt
        label: Descripción accesible de la imagen
        type: string
      - name: introduction
        label: Introducción
        type: text
        required: true
      - name: sections
        label: Pasos o secciones
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Encabezado
            type: string
            required: true
          - name: body
            label: Contenido
            type: text
            required: true
      - name: reflection
        label: Reflexión final
        type: text
      - name: order
        label: Orden
        type: number
      - name: published
        label: Publicado
        type: boolean


  - name: cursos
    label: Cursos / Recorridos
    type: collection
    path: src/content/cursos
    format: json
    filename: "{fields.key}.json"
    operations:
      rename: false
    view:
      fields: [title, aula, published, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: key
        label: ID estable (único)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "No cambiar después de publicar; lo usan las secciones."
      - name: slug
        label: URL / slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: aula
        label: Aula
        type: reference
        required: true
        options:
          collection: aulas
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: title
        label: Título del curso
        type: string
        required: true
      - name: subtitle
        label: Subtítulo
        type: string
      - name: summary
        label: Resumen breve
        type: text
      - name: description
        label: Presentación completa
        type: rich-text
      - name: focus
        label: Ideas clave
        type: string
        list: true
      - name: featured
        label: Destacado
        type: boolean
      - name: image
        label: Imagen de portada del curso
        type: image
      - name: imageAlt
        label: Descripción accesible de la portada
        type: string
      - name: order
        label: Orden
        type: number
      - name: published
        label: Curso visible
        type: boolean

  - name: secciones
    label: Secciones / Etapas
    type: collection
    path: src/content/secciones
    format: json
    filename: "{fields.key}.json"
    operations:
      rename: false
    view:
      fields: [title, course, order, published]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: key
        label: ID estable (único)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: slug
        label: URL / slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: course
        label: Curso
        type: reference
        required: true
        options:
          collection: cursos
          value: "{fields.key}"
          label: "{fields.title}"
      - name: title
        label: Nombre de la sección
        type: string
        required: true
      - name: subtitle
        label: Subtítulo
        type: string
      - name: summary
        label: Presentación
        type: text
      - name: order
        label: Orden dentro del curso
        type: number
      - name: published
        label: Sección visible
        type: boolean

  - name: lecciones
    label: Lecciones y contenido
    type: collection
    path: src/content/lecciones
    format: json
    filename: "{fields.key}.json"
    operations:
      rename: false
    view:
      fields: [title, section, status, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: key
        label: ID estable (único)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: slug
        label: URL / slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: section
        label: Sección
        type: reference
        required: true
        options:
          collection: secciones
          value: "{fields.key}"
          label: "{fields.title}"
      - name: title
        label: Título
        type: string
        required: true
      - name: summary
        label: Resumen
        type: text
      - name: order
        label: Orden dentro de la sección
        type: number
      - name: durationMinutes
        label: Duración orientativa en minutos
        type: number
      - name: status
        label: Estado público
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Borrador (oculto)
            - name: planned
              label: Próximamente (solo título)
            - name: published
              label: Publicado y accesible
      - name: blocks
        label: Bloques de contenido
        type: block
        blockKey: type
        list:
          collapsible:
            collapsed: true
            summary: "{type}"
        blocks:
          - name: text
            label: Texto / lectura
            fields:
              - name: title
                label: Subtítulo
                type: string
              - name: body
                label: Texto
                type: rich-text
          - name: audio
            label: Audio
            fields:
              - name: title
                label: Título
                type: string
              - name: url
                label: URL de audio (HTTPS)
                type: string
                required: true
              - name: body
                label: Transcripción o notas
                type: rich-text
          - name: video
            label: Video
            fields:
              - name: title
                type: string
              - name: url
                label: URL de video (MP4, YouTube o Vimeo)
                type: string
                required: true
              - name: body
                label: Transcripción o notas
                type: rich-text
          - name: image
            label: Imagen
            fields:
              - name: url
                label: Imagen
                type: image
              - name: alt
                label: Descripción accesible
                type: string
              - name: body
                label: Pie de foto
                type: text
          - name: practice
            label: Práctica guiada
            fields:
              - name: title
                type: string
                required: true
              - name: minutes
                label: Minutos orientativos
                type: number
              - name: body
                label: Instrucciones
                type: rich-text
          - name: reflection
            label: Preguntas de reflexión
            fields:
              - name: title
                type: string
              - name: prompts
                label: Preguntas
                type: string
                list: true
          - name: quote
            label: Cita
            fields:
              - name: body
                type: text
